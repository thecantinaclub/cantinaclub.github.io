
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Cantina Club - Admin</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
    }

    h1, h2 {
      color: #d5b46a;
    }

    input, button {
      box-sizing: border-box;
      padding: 11px;
      margin: 5px 0;
      border-radius: 5px;
      font-size: 15px;
    }

    input {
      display: block;
      width: 100%;
      max-width: 400px;
      background: #222;
      color: white;
      border: 1px solid #555;
    }

    button {
      cursor: pointer;
      border: 0;
      margin-right: 8px;
    }

    .gold {
      background: #d5b46a;
      color: #111;
    }

    .reject {
      background: #8e3030;
      color: white;
    }

    .card {
      border: 1px solid #444;
      border-radius: 8px;
      padding: 16px;
      margin: 20px 0;
      overflow-wrap: anywhere;
    }

    .preview {
      display: block;
      max-width: 100%;
      max-height: 400px;
      margin: 12px 0;
      border-radius: 5px;
    }

    #message {
      margin: 16px 0;
      white-space: pre-wrap;
    }

    .muted {
      color: #bbb;
    }
  </style>
</head>
<body>
<main>
  <h1>The Cantina Club</h1>
  <h2>Gallery Administration</h2>

  <section id="login">
    <p>Sign in with your administrator account.</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button class="gold" type="submit">Sign in</button>
    </form>
  </section>

  <section id="dashboard" hidden>
    <p id="signedIn" class="muted"></p>
    <button id="refreshButton" class="gold" type="button">Refresh submissions</button>
    <button id="logoutButton" type="button">Sign out</button>
    <div id="submissions"></div>
  </section>

  <p id="message" role="status"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://auxtwhflkzyvgbuqcrkc.supabase.co";
  var SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wCVhkM5UuTdTdISy0U56IA_S5n3-2pz";
  var ADMIN_USER_ID = "b49ce175-f0dc-4296-9964-329e690111a2";

  var client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  var loginSection = document.getElementById("login");
  var dashboard = document.getElementById("dashboard");
  var message = document.getElementById("message");
  var submissions = document.getElementById("submissions");

  function showMessage(text) {
    message.textContent = text;
  }

  function setBusy(button, busy, label) {
    button.disabled = busy;
    if (busy) {
      button.dataset.originalLabel = button.textContent;
      button.textContent = label;
    } else if (button.dataset.originalLabel) {
      button.textContent = button.dataset.originalLabel;
      delete button.dataset.originalLabel;
    }
  }

  function addText(parent, tag, text, className) {
    var element = document.createElement(tag);
    element.textContent = text;
    if (className) element.className = className;
    parent.appendChild(element);
    return element;
  }

  async function checkAdministrator() {
    var result = await client.auth.getUser();

    if (result.error) throw result.error;

    var user = result.data.user;

    if (!user || user.id !== ADMIN_USER_ID) {
      loginSection.hidden = false;
      dashboard.hidden = true;
      throw new Error("This account is not the configured administrator account.");
    }

    loginSection.hidden = true;
    dashboard.hidden = false;
    document.getElementById("signedIn").textContent =
      "Signed in as " + user.email;

    return user;
  }

  async function loadSubmissions() {
    showMessage("Loading pending submissions...");
    submissions.replaceChildren();

    try {
      await checkAdministrator();

      var result = await client
        .from("gallery_submissions")
        .select("*")
        .eq("status", "pending")
        .order("created_at", { ascending: true });

      if (result.error) throw result.error;

      if (!result.data || result.data.length === 0) {
        showMessage("There are no pending submissions.");
        return;
      }

      showMessage("Pending submissions: " + result.data.length);

      for (var i = 0; i < result.data.length; i++) {
        await createSubmissionCard(result.data[i]);
      }
    } catch (error) {
      showMessage("Error: " + error.message);
    }
  }

  async function createSubmissionCard(item) {
    var card = document.createElement("article");
    card.className = "card";
    submissions.appendChild(card);

    addText(card, "h2", item.character_name);
    addText(card, "p", "Performer: " + item.performer_name);
    addText(card, "p", "Universe: " + item.universe);
    addText(card, "p", "Project: " + item.project_title);
    addText(card, "p", "Media type: " + item.media_type);
    addText(card, "p", "Year: " + (item.year || "Not supplied"));
    addText(card, "p", "Image credit: " + (item.image_credit || "Not supplied"));
    addText(card, "p", "Submitted: " + new Date(item.created_at).toLocaleString());

    var imageResult = await client.storage
      .from("pending-uploads")
      .createSignedUrl(item.storage_path, 300);

    if (imageResult.error) {
      addText(card, "p", "Image preview unavailable: " + imageResult.error.message);
    } else {
      var image = document.createElement("img");
      image.className = "preview";
      image.alt = "Submitted gallery image";
      image.src = imageResult.data.signedUrl;
      card.appendChild(image);
    }

    var approveButton = document.createElement("button");
    approveButton.className = "gold";
    approveButton.type = "button";
    approveButton.textContent = "Approve";
    card.appendChild(approveButton);

    var rejectButton = document.createElement("button");
    rejectButton.className = "reject";
    rejectButton.type = "button";
    rejectButton.textContent = "Reject";
    card.appendChild(rejectButton);

    approveButton.addEventListener("click", async function () {
      if (!window.confirm("Approve this image and publish it in the gallery?")) {
        return;
      }

      setBusy(approveButton, true, "Approving...");
      rejectButton.disabled = true;
      showMessage("Approving submission...");

      try {
        await checkAdministrator();

        var downloadResult = await client.storage
          .from("pending-uploads")
          .download(item.storage_path);

        if (downloadResult.error) throw downloadResult.error;

        var uploadResult = await client.storage
          .from("approved-gallery")
          .upload(item.storage_path, downloadResult.data, {
            upsert: false,
            contentType: downloadResult.data.type || "image/jpeg"
          });

        if (uploadResult.error) throw uploadResult.error;

        var updateResult = await client
          .from("gallery_submissions")
          .update({ status: "approved" })
          .eq("id", item.id)
          .eq("status", "pending");

        if (updateResult.error) throw updateResult.error;

        var removeResult = await client.storage
          .from("pending-uploads")
          .remove([item.storage_path]);

        if (removeResult.error) {
          showMessage(
            "Approved and published, but the private original could not be removed: " +
            removeResult.error.message
          );
        } else {
          showMessage("Approved. The image is now published in the gallery.");
        }

        card.remove();
      } catch (error) {
        showMessage("Approval failed: " + error.message);
        setBusy(approveButton, false, "Approving...");
        rejectButton.disabled = false;
      }
    });

    rejectButton.addEventListener("click", async function () {
      if (!window.confirm("Reject this submission?")) {
        return;
      }

      setBusy(rejectButton, true, "Rejecting...");
      approveButton.disabled = true;
      showMessage("Rejecting submission...");

      try {
        await checkAdministrator();

        var updateResult = await client
          .from("gallery_submissions")
          .update({ status: "rejected" })
          .eq("id", item.id)
          .eq("status", "pending");

        if (updateResult.error) throw updateResult.error;

        var removeResult = await client.storage
          .from("pending-uploads")
          .remove([item.storage_path]);

        card.remove();

        if (removeResult.error) {
          showMessage(
            "Submission rejected, but the private image could not be removed: " +
            removeResult.error.message
          );
        } else {
          showMessage("Submission rejected.");
        }
      } catch (error) {
        showMessage("Rejection failed: " + error.message);
        setBusy(rejectButton, false, "Rejecting...");
        approveButton.disabled = false;
      }
    });
  }

  document.getElementById("loginForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    var button = this.querySelector('button[type="submit"]');
    setBusy(button, true, "Signing in...");
    showMessage("Signing in...");

    try {
      var result = await client.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      });

      if (result.error) throw result.error;

      await checkAdministrator();
      document.getElementById("password").value = "";
      await loadSubmissions();
    } catch (error) {
      showMessage("Sign-in failed: " + error.message);
    } finally {
      setBusy(button, false, "Signing in...");
    }
  });

  document.getElementById("refreshButton").addEventListener("click", loadSubmissions);

  document.getElementById("logoutButton").addEventListener("click", async function () {
    await client.auth.signOut();
    loginSection.hidden = false;
    dashboard.hidden = true;
    submissions.replaceChildren();
    document.getElementById("password").value = "";
    showMessage("You have signed out.");
  });

  client.auth.getSession().then(function (result) {
    if (result.error) {
      showMessage("Session error: " + result.error.message);
      return;
    }

    if (result.data.session) {
      loadSubmissions();
    }
  });
})();
</script>
</body>
</html>
